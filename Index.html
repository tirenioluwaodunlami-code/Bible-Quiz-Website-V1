<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Quiz Home</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f3ea;
      color: #1f2a37;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #102a43, #1d4f91);
      color: white;
      padding: 25px 0;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.7rem;
      font-weight: bold;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      opacity: 0.9;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 80px 0;
      gap: 40px;
    }

    .hero-text {
      flex: 1;
    }

    .hero-text h1 {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #102a43;
    }

    .hero-text p {
      font-size: 1.1rem;
      max-width: 600px;
      line-height: 1.6;
      color: #334155;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-primary {
      background: #d4a73a;
      color: #1b1b1b;
      font-weight: bold;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #102a43;
    }

    .hero-card {
      flex: 0.8;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .hero-card h3 {
      margin-top: 0;
      color: #102a43;
    }

    .difficulty-grid {
      display: grid;
      gap: 18px;
      margin-top: 20px;
    }

    .difficulty-card {
      background: #f8fafc;
      border: 2px solid #dbeafe;
      border-radius: 14px;
      padding: 18px;
      transition: 0.2s ease;
    }

    .difficulty-card:hover {
      transform: translateY(-3px);
      border-color: #d4a73a;
    }

    .difficulty-card h4 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .easy { border-left: 6px solid #4caf50; }
    .medium { border-left: 6px solid #f59e0b; }
    .hard { border-left: 6px solid #ef4444; }

    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin: 20px 0 60px;
    }

    .feature {
      background: white;
      padding: 25px 20px;
      text-align: center;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .feature strong {
      display: block;
      font-size: 1.2rem;
      color: #102a43;
      margin-top: 12px;
    }

    footer {
      background: #102a43;
      color: white;
      text-align: center;
      padding: 20px 0;
      margin-top: 40px;
    }

    footer a {
      color: #d4a73a;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
      }

      .features {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="logo">Bible Quiz</div>
        <div class="nav-links">
          <a href="#" class="notify-work">Home</a>
          <a href="#" class="notify-work">Levels</a>
          <a href="#" class="notify-work">Stories</a>
          <a href="#" class="notify-work">About</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-text">
        <h1>Test your Bible knowledge</h1>
        <p>
          Explore stories, characters, lessons, and important moments from the Bible.
          Choose your difficulty and begin your next challenge.
        </p>
        <div class="buttons">
          <button id="startQuizBtn" class="btn btn-primary">Start Quiz</button>
          <button class="btn btn-secondary notify-work">View Stories</button>
        </div>
      </div>

      <!-- Difficulty selection has been moved to the overlay modal triggered by Start Quiz -->
    </section>

    <!-- Difficulty overlay/modal (hidden by default) -->
    <div id="difficultyOverlay" style="display:none; position:fixed; inset:0; z-index:9999;">
      <div id="overlayBackdrop" style="position:absolute; inset:0; background:rgba(0,0,0,0.6);"></div>
      <div style="position:relative; max-width:420px; margin:80px auto; background:white; border-radius:12px; padding:20px; z-index:10000;">
        <h3 style="margin-top:0">Select Difficulty</h3>
        <div style="display:flex; gap:10px; flex-direction:column;">
          <a class="btn btn-primary" href="quiz-easy.html" style="text-align:center">Easy</a>
          <a class="btn btn-primary" href="quiz-medium.html" style="text-align:center">Medium</a>
          <a class="btn btn-primary" href="quiz-hard.html" style="text-align:center">Hard</a>
        </div>
        <div style="margin-top:12px; text-align:right;"><button id="closeOverlay" class="btn" style="background:#eef2ff;">Cancel</button></div>
      </div>
    </div>

    <section class="features">
      <div class="feature">
        <div>📖</div>
        <strong>3 Levels</strong>
      </div>
      <div class="feature">
        <div>🧠</div>
        <strong>Story-based</strong>
      </div>
      <div class="feature">
        <div>🏆</div>
        <strong>Fun Challenges</strong>
      </div>
      <div class="feature">
        <div>✨</div>
        <strong>Daily Quiz</strong>
      </div>
    </section>
  </main>

  <footer>
    <a href="contact.html">Contact Us</a>
  </footer>
  <!-- Toast for "being worked on" messages -->
  <div id="toast" style="position:fixed; right:20px; bottom:20px; background:#111; color:#fff; padding:12px 16px; border-radius:8px; display:none; opacity:0.95; z-index:20000"></div>

  <script>
    // Show overlay when Start Quiz clicked
    document.getElementById('startQuizBtn').addEventListener('click', () => {
      document.getElementById('difficultyOverlay').style.display = 'block';
    });

    // Close overlay
    document.getElementById('closeOverlay').addEventListener('click', () => {
      document.getElementById('difficultyOverlay').style.display = 'none';
    });
    document.getElementById('overlayBackdrop').addEventListener('click', () => {
      document.getElementById('difficultyOverlay').style.display = 'none';
    });

    // Notify-work handler for non-functional links/buttons
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._timeout);
      t._timeout = setTimeout(() => t.style.display = 'none', 3000);
    }

    document.addEventListener('click', (e) => {
      const el = e.target.closest('a, button');
      if (!el) return;
      // anchors with href="#" or elements with class notify-work
      if ((el.tagName === 'A' && el.getAttribute('href') === '#') || el.classList.contains('notify-work')) {
        e.preventDefault();
        showToast('This feature is being worked on.');
      }
    });
  </script>
</body>
</html>
